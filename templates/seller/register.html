<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seller Registration - Gemaura</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
</head>
<body>
<div class="admin-auth-page">
    <div class="auth-card">
        <div class="auth-logo">
            <h2>GEMAURA</h2>
            <div class="role">Register Your Shop</div>
        </div>
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
            <div class="alert alert-{{ category }}" style="margin-bottom:16px;">{{ message }}</div>
            {% endfor %}
        {% endwith %}
        <form method="POST">
            <div class="form-group">
                <label class="form-label">Shop / Brand Name</label>
                <input type="text" name="shop_name" class="form-control" placeholder="e.g. Radha Jewels" required>
            </div>
            <div class="form-group">
                <label class="form-label">Email Address</label>
                <input type="email" name="email" class="form-control" placeholder="shop@email.com" required>
            </div>
            <div class="form-group">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-control" placeholder="Create a strong password" required>
            </div>
            <button type="submit" class="auth-submit">Register Shop</button>
        </form>
        <div style="margin-top:16px;padding:12px 16px;background:#EBF5FB;border-radius:8px;font-size:12px;color:#1a4d6e;">
            ℹ️ Your registration will be reviewed by our admin team. You can login after approval.
        </div>
        <p style="text-align:center;margin-top:16px;font-size:14px;color:var(--text-light);">
            Already registered? <a href="{{ url_for('seller.login') }}" style="color:var(--gold-dark);font-weight:600;">Sign In</a>
        </p>
    </div>
</div>
</body>
</html>
