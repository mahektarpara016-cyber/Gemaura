<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Gemaura</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
</head>
<body>
<div class="admin-auth-page">
    <div class="auth-card">
        <div class="auth-logo">
            <h2>GEMAURA</h2>
            <div class="role">Admin Control Panel</div>
        </div>
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
            <div class="alert alert-{{ category }}" style="margin-bottom:16px;">{{ message }}</div>
            {% endfor %}
        {% endwith %}
        <form method="POST">
            <div class="form-group">
                <label class="form-label">Admin Email</label>
                <input type="email" name="email" class="form-control" placeholder="admin@gemaura.com" required>
            </div>
            <div class="form-group">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-control" placeholder="••••••••" required>
            </div>
            <button type="submit" class="auth-submit">Sign In as Admin</button>
        </form>
        <div style="margin-top:24px;padding:16px;background:#FEF9E7;border-radius:8px;font-size:13px;color:#7a5c10;border:1px solid #f0dd9a;">
            <strong>Demo Credentials:</strong><br>
            Email: admin@gemaura.com<br>
            Password: admin123
        </div>
        <div style="margin-top:20px;padding-top:20px;border-top:1px solid var(--beige-dark);display:flex;justify-content:center;gap:20px;font-size:13px;">
            <a href="{{ url_for('user.login') }}" style="color:var(--text-light);">User Login</a>
            <a href="{{ url_for('seller.login') }}" style="color:var(--text-light);">Seller Login</a>
        </div>
    </div>
</div>
<script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
