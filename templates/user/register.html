<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Gemaura</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
</head>
<body>
<div class="admin-auth-page">
    <div class="auth-card">
        <div class="auth-logo">
            <h2>GEMAURA</h2>
            <div class="role">Create Account</div>
        </div>
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
            <div class="alert alert-{{ category }}" style="margin-bottom:16px;">{{ message }}</div>
            {% endfor %}
        {% endwith %}
        <form method="POST">
            <div class="form-group">
                <label class="form-label">Full Name</label>
                <input type="text" name="name" class="form-control" placeholder="Your full name" required>
            </div>
            <div class="form-group">
                <label class="form-label">Email Address</label>
                <input type="email" name="email" class="form-control" placeholder="your@email.com" required>
            </div>
            <div class="form-group">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-control" placeholder="Create a strong password" required>
            </div>
            <button type="submit" class="auth-submit">Create Account</button>
        </form>
        <p style="text-align:center;margin-top:20px;font-size:14px;color:var(--text-light);">
            Already have an account? <a href="{{ url_for('user.login') }}" style="color:var(--gold-dark);font-weight:600;">Sign In</a>
        </p>
    </div>
</div>
</body>
</html>
